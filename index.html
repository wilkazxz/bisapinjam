<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>BisaPINJAM: pinjam barang dengan QR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><path d='M28 30h26l22 22-22 22H28z' fill='white'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* style.css: gaya bersama (tema, komponen dasar) untuk index.html dan admin.html */
:root{--ink:#0e2747;--bg:rgba(255,255,255,.42);--sheet:rgba(255,255,255,.86);--soft:rgba(255,255,255,.62);--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.85);--line:rgba(37,99,235,.18);--mute:#587291;--hero:linear-gradient(135deg,rgba(184,210,255,.9),rgba(238,244,255,.85));--dark:#2563eb;--on-dark:#fff;--shadow:0 8px 28px rgba(37,99,235,.14);--tint:rgba(37,99,235,.12);--tinttxt:#1d4ed8;--ph:rgba(37,99,235,.08);--ok:#0b7a6b;--red:#b3291c;--warn:#9a6a00;--page:linear-gradient(160deg,#e4eeff,#f7faff 45%,#d6e6ff);--b1:#9cc2ff;--b2:#c4d9ff;--b3:#a5c6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f0ff;--bg:rgba(20,34,62,.5);--sheet:rgba(16,28,52,.88);--soft:rgba(255,255,255,.08);--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.14);--line:rgba(147,185,255,.2);--mute:#9bb2d4;--hero:linear-gradient(135deg,rgba(47,107,255,.38),rgba(20,34,62,.6));--dark:#3b82f6;--shadow:0 8px 28px rgba(0,0,0,.35);--tint:rgba(96,165,250,.18);--tinttxt:#9cc2ff;--ph:rgba(255,255,255,.06);--ok:#37c2ad;--red:#ff8a7a;--warn:#ffc83d;--page:linear-gradient(160deg,#0a1426,#0f2144 50%,#0a1830);--b1:#1d4ed8;--b2:#1e3a8a;--b3:#2563eb;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8f0ff;--bg:rgba(20,34,62,.5);--sheet:rgba(16,28,52,.88);--soft:rgba(255,255,255,.08);--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.14);--line:rgba(147,185,255,.2);--mute:#9bb2d4;--hero:linear-gradient(135deg,rgba(47,107,255,.38),rgba(20,34,62,.6));--dark:#3b82f6;--shadow:0 8px 28px rgba(0,0,0,.35);--tint:rgba(96,165,250,.18);--tinttxt:#9cc2ff;--ph:rgba(255,255,255,.06);--ok:#37c2ad;--red:#ff8a7a;--warn:#ffc83d;--page:linear-gradient(160deg,#0a1426,#0f2144 50%,#0a1830);--b1:#1d4ed8;--b2:#1e3a8a;--b3:#2563eb;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--page) fixed;color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;text-align:left;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 8%,var(--b1),transparent 42%),radial-gradient(circle at 92% 34%,var(--b2),transparent 46%),radial-gradient(circle at 28% 96%,var(--b3),transparent 46%)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{letter-spacing:-.02em;text-wrap:balance}
p{text-wrap:pretty}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s,box-shadow .2s}
button:active{transform:scale(.96)}
a{color:inherit}
:focus-visible{outline:3px solid var(--dark);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* komponen bersama */
.note{font-size:.88rem;color:var(--mute)}
.small{font-size:.85rem;margin-top:6px}
.late{color:var(--red)}
.card{background:var(--soft);border-radius:18px;padding:16px}
.card h3{font-size:1rem;font-weight:700;margin:8px 0 2px}
.t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font:500 .78rem ui-monospace,Menlo,monospace;background:var(--tint);color:var(--tinttxt);padding:2px 8px;border-radius:6px}
.st{font-size:.76rem;font-weight:500;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor}
.st.wait{color:var(--warn)}.st.ok{color:var(--ok)}.st.done{color:var(--mute)}.st.no{color:var(--red)}
.btn{border:0;border-radius:16px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-weight:600;font-size:.92rem;background:var(--soft)}
.btn.pri{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.btn.bad{color:var(--red)}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
label{display:block;font-size:.85rem;font-weight:600;margin-top:12px}
label input,label select,#kode{width:100%;margin-top:4px;padding:12px 14px;border:0;border-radius:14px;background:var(--soft);font-weight:400}
.empty{padding:28px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:18px;grid-column:1/-1}
.card,.btn,label input,label select,#kode{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge)}
.card{box-shadow:var(--shadow)}
.btn.pri{border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.35)}

/* dialog (bottom sheet) */
dialog{border:0;border-radius:26px 26px 0 0;padding:0;width:min(460px,100%);max-width:100%;margin:auto auto 0;background:var(--sheet);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--edge);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,15,.55)}
.sheet{max-height:88vh;overflow:auto;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
.sheet h2{font-size:1.35rem;font-weight:700}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--dark);color:var(--on-dark);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.9rem;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

.demo{background:var(--tint);color:var(--tinttxt);text-align:center;font-size:.8rem;font-weight:600;padding:6px 12px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
dialog[open]{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fade .3s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* app.css: gaya khusus halaman peminjam (index.html) */
.cats,.chips{scrollbar-width:none}
.cats::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.card{margin-bottom:12px}
.app{max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);padding:18px 18px 120px;backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--edge);border-top:0;border-bottom:0;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.word{font-size:1.55rem;font-weight:800;letter-spacing:-.03em}
.ibtn{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center}
.ibtn+.ibtn{margin-left:8px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
.search{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:0 8px 0 14px;height:50px}
.search input{flex:1;min-width:0;border:0;background:none;outline:0}
.search input:focus-visible{outline:0}
.search:focus-within{outline:3px solid var(--dark)}
.flt{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;border-radius:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.toggle button{height:46px;border-radius:14px;border:0;background:var(--soft);font-weight:600;font-size:.9rem}
.toggle button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.hero{border:1px solid var(--edge);box-shadow:var(--shadow);display:grid;grid-template-columns:1.25fr 1fr;background:var(--hero);border-radius:22px;overflow:hidden;min-height:190px}
.hero>div:first-child{padding:20px 0 20px 18px;display:flex;flex-direction:column;align-items:flex-start}
.pill{background:var(--bg);border-radius:8px;font-size:.75rem;padding:3px 10px;font-weight:600}
.hero h2{font-size:1.4rem;line-height:1.2;font-weight:700;margin:12px 0 8px}
.hero p{font-size:.85rem;line-height:1.5;color:var(--mute);margin-bottom:14px}
.dark{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:0;border-radius:14px;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;font-weight:600;font-size:.9rem;margin-top:auto}
.ph{position:relative;overflow:hidden;background:var(--ph);display:grid;place-items:center}
.ph .ico{opacity:.5;color:var(--tinttxt)}
.ph .ico svg{width:44px;height:44px;stroke-width:1.4}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ph{background:transparent;margin:10px 10px 0 0;border-radius:90px 90px 0 0}
.sheet .ph{height:170px;border-radius:20px;margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec h3{font-size:1.2rem;font-weight:700}
.sec button{border:0;background:none;color:var(--mute);font-size:.88rem;text-decoration:underline;padding:0}
.cats{display:flex;gap:10px;justify-content:space-between;overflow-x:auto;padding-bottom:4px}
.cat{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:.78rem;font-weight:500;text-align:center;min-width:62px}
.cat span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:var(--tinttxt);background:var(--soft)}
.cat span svg{width:26px;height:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative}
.pcb{display:block;width:100%;text-align:left;border:0;background:none;padding:0}
.pcb .ph{aspect-ratio:3/4;border-radius:20px}
.pcb h4{font-size:.9rem;font-weight:600;line-height:1.35;margin:10px 2px 2px;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av{font-size:.82rem;font-weight:600;margin:0;color:var(--tinttxt)}
.av.none{color:var(--red)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 2px}
.go{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:.76rem;font-weight:700;padding:6px 14px;border-radius:999px}
.fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:1}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:#e5484d}
.fav[aria-pressed="true"] svg{fill:currentColor}
.bar2{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:16px}
.bar2 h2{text-align:center;font-size:1.15rem;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 16px;padding-bottom:2px}
.chips button{flex:none;border:0;border-radius:14px;background:var(--soft);padding:10px 20px;font-weight:600;font-size:.88rem}
.chips button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
#reader{max-width:340px;margin:12px 0}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
#nav div{pointer-events:auto;display:flex;gap:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge);padding:8px;border-radius:26px;box-shadow:var(--shadow)}
#nav button{min-width:52px;height:52px;border:0;border-radius:20px;background:none;display:flex;align-items:center;justify-content:center;gap:0;padding:0 14px;color:var(--mute);transition:color .3s,transform .12s}
#nav span{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:.85rem;font-weight:700;transition:max-width .35s cubic-bezier(.3,.8,.3,1),margin .35s,opacity .25s}
#nav button[aria-current="true"] span{max-width:90px;margin-left:8px;opacity:1}
#nav button[aria-current="true"]{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.foot{text-align:center;margin-top:28px;font-size:.82rem;color:var(--mute)}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.ibtn,.search,.toggle button,.chips button,.cat span,.fav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge)}
.search,.ibtn,.fav,.cat span{box-shadow:var(--shadow)}
.dark,.toggle button[aria-pressed="true"],.chips button[aria-pressed="true"],#nav button[aria-current="true"]{border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.35)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.4)}100%{transform:scale(1)}}
#main.in{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}
#main.in[data-dir="l"]{animation-name:inL}
#main.in .grid2>.pc,#main.in .card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#main.in .grid2>.pc:nth-child(2){animation-delay:.06s}
#main.in .grid2>.pc:nth-child(3){animation-delay:.12s}
#main.in .grid2>.pc:nth-child(4){animation-delay:.18s}
#main.in .grid2>.pc:nth-child(n+5){animation-delay:.24s}
.fav.pop svg{animation:pop .4s}

</style>
</head>
<body>
<div class="app"><main id="main"></main></div>
<nav id="nav" aria-label="Menu utama"><div></div></nav>
<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Helper + lapisan data Firebase. Bagian ini sama di index.html dan admin.html. */
/* Data: Firebase (Firestore + Auth). Isi firebaseConfig dari Firebase Console
   (Project settings > Your apps > Web app). Isi sama persis di index.html dan admin.html. */
const firebaseConfig = {
  apiKey: 'ISI_DI_SINI',
  authDomain: 'ISI_DI_SINI',
  projectId: 'ISI_DI_SINI',
  appId: 'ISI_DI_SINI'
};
const CFG_OK = !Object.values(firebaseConfig).some(v => v === 'ISI_DI_SINI');
const FB_READY = CFG_OK && typeof firebase !== 'undefined';
const DEMO = !CFG_OK; /* config belum diisi: mode demo, data tersimpan di browser ini */
const FB_MSG = 'Firebase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';
let db = null, auth = null;
if (FB_READY) { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth(); }
else if (DEMO) {
  ({db, auth} = demoFirebase());
  document.body.insertAdjacentHTML('afterbegin', '<div class="demo">Mode demo: data tersimpan di browser ini. Isi firebaseConfig untuk menyambung ke Firebase.</div>');
}
let D = {items: [], loans: []};
const dbErr = e => toast(e && e.code === 'permission-denied' ? 'Akses ditolak. Cek aturan Firestore' : 'Gagal: ' + ((e && e.message) || 'coba lagi'));
const watch = (name, cb, where, fail) => { let r = db.collection(name); if (where) r = r.where(...where); return r.onSnapshot(s => cb(s.docs.map(d => d.data())), e => { dbErr(e); if (fail) fail(e); }); };
const byTs = a => a.sort((x, y) => (x.ts || 0) - (y.ts || 0));
const byId = a => a.sort((x, y) => x.id.localeCompare(y.id));
function demoFirebase() {
  const K = 'bisapinjam-demo-fb';
  let S = null;
  try { S = JSON.parse(localStorage.getItem(K)); } catch (e) {}
  if (!S) S = {items: {}, loans: {}};
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
  const subs = new Set(), notify = () => subs.forEach(f => f());
  addEventListener('storage', e => { if (e.key === K && e.newValue) { try { S = JSON.parse(e.newValue); notify(); } catch (x) {} } });
  const clone = o => JSON.parse(JSON.stringify(o));
  const ref = (col, id) => ({
    get: async () => { const d = col === 'admins' ? (id === 'demo-admin' ? {ok: true} : undefined) : S[col][id]; return {exists: d !== undefined, data: () => d && clone(d)}; },
    set: async d => { S[col][id] = clone(d); persist(); notify(); },
    update: async p => { if (!S[col][id]) throw {code: 'not-found', message: 'Data tidak ditemukan'}; Object.assign(S[col][id], clone(p)); persist(); notify(); },
    delete: async () => { delete S[col][id]; persist(); notify(); }
  });
  const query = (col, w) => ({
    where: (f, op, v) => query(col, [f, op, v]),
    onSnapshot: cb => {
      const f = () => cb({docs: Object.values(S[col] || {}).filter(d => !w || d[w[0]] === w[2]).map(d => ({data: () => clone(d)}))});
      subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
    }
  });
  const db = {
    collection: col => ({...query(col), doc: id => ref(col, id)}),
    runTransaction: async fn => {
      const pend = [];
      await fn({get: r => r.get(), update: (r, p) => { pend.push(() => r.update(p)); }});
      for (const f of pend) await f();
    },
    batch: () => { const ops = []; return {set: (r, d) => { ops.push(() => r.set(d)); }, commit: async () => { for (const f of ops) await f(); }}; }
  };
  const isAdm = () => { try { return sessionStorage.getItem('pp-demo-admin') === '1'; } catch (e) { return false; } };
  const user = () => isAdm() ? {uid: 'demo-admin', isAnonymous: false} : {uid: 'demo-user', isAnonymous: true};
  const aSubs = new Set(), fire = () => aSubs.forEach(f => f(user()));
  const auth = {
    get currentUser() { return user(); },
    onAuthStateChanged: cb => { aSubs.add(cb); setTimeout(() => cb(user()), 0); return () => aSubs.delete(cb); },
    signInAnonymously: async () => {},
    signInWithEmailAndPassword: async (e, p) => {
      if (e.toLowerCase() !== 'admin@demo.test' || p !== 'admin123') throw {code: 'auth/invalid-credential'};
      try { sessionStorage.setItem('pp-demo-admin', '1'); } catch (x) {} fire();
    },
    signOut: async () => { try { sessionStorage.removeItem('pp-demo-admin'); } catch (x) {} fire(); }
  };
  return {db, auth};
}


const q = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); /* tanggal lokal, bukan UTC */
const today = () => ymd(new Date());
const addDays = n => ymd(new Date(Date.now() + n * 864e5));
const fmt = d => d ? new Date(d + 'T00:00').toLocaleDateString('id-ID', {day:'numeric', month:'short'}) : '-';
const item = id => D.items.find(i => i.id === id);
const toast = m => { const t = q('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); };
const closeDlg = () => q('#dlg').close();
q('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDlg(); });

const STAT = {diajukan:['Menunggu persetujuan','wait'], disetujui:['Disetujui, siap diambil','ok'], dipinjam:['Sedang dipinjam','ok'], selesai:['Selesai','done'], ditolak:['Ditolak','no'], dibatalkan:['Dibatalkan','no']};
const loanInfo = l => {
  const i = item(l.item) || {name: l.item}, [s, c] = STAT[l.status], late = l.status === 'dipinjam' && l.due < today();
  return `<div class="t"><span class="code">${esc(l.id)}</span><span class="st ${c}">${s}</span></div>
<h3>${esc(i.name)} × ${l.qty}</h3><p class="note">${esc(l.who)}${l.kelas ? ' (' + esc(l.kelas) + ')' : ''}, untuk ${esc(l.purpose)}</p>
<p class="small">Pinjam ${fmt(l.date)}, kembali ${fmt(l.due)}${l.ret ? `, dikembalikan ${fmt(l.ret.date)} (${esc(l.ret.cond.toLowerCase())})` : ''}${late ? ' <b class="late">Terlambat</b>' : ''}</p>${l.note ? `<p class="small note">Catatan admin: ${esc(l.note)}</p>` : ''}`;
};

</script>
<script>
/* app.js: logika halaman peminjam. Butuh data.js (D, load, save, helper). */
/* Foto barang: taruh stok1.jpg sampai stok5.jpg di folder yang sama dengan index.html. */
let ready = false, favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('pp-fav') || '[]')); } catch (e) {}
const saveFav = () => { try { localStorage.setItem('pp-fav', JSON.stringify([...favs])); } catch (e) {} };

const P = {
  home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  qr: '<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2v2h-2zM19 19h2M15 20h2M20 15v2"/>',
  bag: '<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  heart: '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  router: '<rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 17h.01M11 17h.01M8 11a6 6 0 0 1 8 0M5.5 8.5a10 10 0 0 1 13 0"/>',
  projector: '<rect x="3" y="8" width="18" height="9" rx="2"/><circle cx="15" cy="12.5" r="2.5"/><path d="M6 20v-3M18 20v-3M6.5 12.5h2"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const EMO = {'Komputer':'laptop', 'Alat jaringan':'wrench', 'Perangkat jaringan':'router', 'Presentasi':'projector'};
const catList = () => [...[...new Set(D.items.map(i => i.cat))].slice(0, 4).map(c => [c, EMO[c] || 'box', c]), ['Semua', 'tag', '']];

let tab = 'home', term = '', cat = '', onlyFav = false, flt = 'all', me = '', kelas = '', okOnly = false, hist = false;
try { me = localStorage.getItem('pp-me') || ''; kelas = localStorage.getItem('pp-kelas') || ''; } catch (e) {}

const photo = (src, emo, alt, cls = '') => `<div class="ph ${cls}"><span class="ico">${ic(emo)}</span>${src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : ''}</div>`;
const card = i => `<article class="pc"><button class="fav" data-fav="${esc(i.id)}" aria-pressed="${favs.has(i.id)}" aria-label="Tandai ${esc(i.name)} sebagai favorit">${ic('heart')}</button>
<button class="pcb" data-open="${esc(i.id)}">${photo(i.img, EMO[i.cat] || 'box', i.name)}<h4>${esc(i.name)}</h4>
<div class="meta"><p class="av ${i.stock ? '' : 'none'}">${i.stock ? i.stock + ' tersedia' : 'Stok habis'}</p>${i.stock ? '<span class="go">Pinjam</span>' : ''}</div></button></article>`;
const mineActive = () => D.loans.filter(l => ['diajukan', 'disetujui', 'dipinjam'].includes(l.status));
const filtered = () => D.items.filter(i => (i.name + i.cat + i.id).toLowerCase().includes(term.toLowerCase()) && (!cat || i.cat === cat) && (!onlyFav || favs.has(i.id)) && (!okOnly || i.stock));
const gridHtml = l => l.length ? l.map(card).join('') : `<p class="empty">${!D.items.length ? 'Belum ada barang. Admin belum menambahkan stok.' : onlyFav ? 'Belum ada favorit. Ketuk ikon hati pada barang.' : 'Tidak ada barang yang cocok. Coba kata kunci atau kategori lain.'}</p>`;
const back = t => `<div class="bar2"><button class="ibtn" data-tab="home" aria-label="Kembali">${ic('back')}</button><h2>${t}</h2><span></span></div>`;
const loanCard = l => `<article class="card">${loanInfo(l)}${l.status === 'diajukan' ? `<div class="row"><button class="btn bad" data-cancel="${esc(l.id)}">Batalkan pengajuan</button></div>` : ''}</article>`;

const views = {
  home: () => {
    const hot = [...D.items].filter(i => flt === 'all' || i.stock).sort((a, b) => (b.total - b.stock) - (a.total - a.stock)).slice(0, 4);
    const n = mineActive().length;
    return `<div class="top"><span class="word">BisaPINJAM</span><div style="display:flex"><button class="ibtn" data-heart aria-label="Barang favorit">${ic('heart')}</button><button class="ibtn" data-tab="mine" aria-label="Pinjaman saya">${ic('bag')}${n ? `<span class="badge">${n}</span>` : ''}</button></div></div>
<form class="search" id="hs">${ic('search')}<input id="hq" type="search" placeholder="Cari nama atau kode barang" aria-label="Cari barang"><button type="button" class="flt" data-tab="barang" aria-label="Lihat semua barang">${ic('sliders')}</button></form>
<div class="toggle"><button data-flt="all" aria-pressed="${flt === 'all'}">Semua barang</button><button data-flt="ok" aria-pressed="${flt === 'ok'}">Tersedia</button></div>
<section class="hero"><div><span class="pill">Baru</span><h2>Pinjam alat praktik</h2><p>Scan QR di barang atau pilih dari daftar untuk mulai meminjam.</p><button class="dark" data-tab="scan">${ic('qr')}Scan sekarang</button></div>${photo('stok1.jpg', 'tag', '')}</section>
<div class="sec"><h3>Kategori</h3><button data-tab="barang">Lihat semua</button></div>
<div class="cats">${catList().map(([l, e, v]) => `<button class="cat" data-cat="${esc(v)}"><span>${ic(e)}</span>${l}</button>`).join('')}</div>
<div class="sec"><h3>Sering dipinjam</h3><button data-tab="barang">Lihat semua</button></div>
<div class="grid2">${gridHtml(hot)}</div>
<p class="foot"><a href="admin.html">Masuk admin</a></p>`;
  },
  barang: () => `${back('Barang')}<form class="search" id="bs">${ic('search')}<input id="search" type="search" placeholder="Cari nama atau kode barang" value="${esc(term)}" aria-label="Cari barang"></form>
<div class="chips">${['', ...new Set(D.items.map(i => i.cat))].map(c => `<button data-cat="${esc(c)}" aria-pressed="${cat === c && !onlyFav}">${c || 'Semua'}</button>`).join('')}<button data-heart aria-pressed="${onlyFav}">Favorit</button><button data-ok aria-pressed="${okOnly}">Tersedia</button></div>
<div class="grid2" id="list">${gridHtml(filtered())}</div>`,
  scan: () => `${back('Scan QR')}<div class="card"><p class="note">Arahkan kamera ke label QR pada barang.</p>
<div class="row"><button class="btn pri" id="cam">${ic('qr')}Nyalakan kamera</button></div><div id="reader"></div>
<form id="manual"><label>Atau ketik kode barang<input id="kode" placeholder="Contoh: BRG-001" required></label>
<div class="row"><button class="btn">Cari barang</button></div></form>
${D.items.length ? `<p class="small note">Kode contoh: ${D.items.slice(0, 3).map(i => `<a href="#" data-fill="${esc(i.id)}">${esc(i.id)}</a>`).join(', ')}</p>` : ''}</div>`,
  mine: () => {
    const act = l => ['diajukan', 'disetujui', 'dipinjam'].includes(l.status);
    const m = [...D.loans].reverse().filter(l => act(l) !== hist);
    return `${back('Pinjaman saya')}<div class="chips"><button data-hist="0" aria-pressed="${!hist}">Aktif</button><button data-hist="1" aria-pressed="${hist}">Riwayat</button></div>${m.length ? m.map(loanCard).join('') : `<p class="empty">${hist ? 'Belum ada riwayat pinjaman.' : 'Tidak ada pinjaman aktif. Pilih barang di beranda lalu ajukan peminjaman.'}</p>`}`;
  }
};

let scanner = null;
const stopScan = () => { if (scanner) { const s = scanner; scanner = null; s.stop().catch(() => {}); } };
const render = keep => {
  stopScan();
  q('#main').innerHTML = ready ? views[tab]() : '<p class="empty">Memuat data…</p>';
  const nav = q('#nav div');
  if (!nav.children.length) nav.innerHTML = [['home','Beranda','home'], ['barang','Barang','grid'], ['scan','Scan QR','qr'], ['mine','Pinjaman saya','bag']]
    .map(([k, l, i]) => `<button data-tab="${k}" aria-label="${l}" aria-current="${k === tab}">${ic(i)}<span>${l.split(' ')[0]}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab));
  if (!keep) { scrollTo(0, 0); const m = q('#main'); m.classList.remove('in'); void m.offsetWidth; m.classList.add('in'); }
};
const go = t => { const o = ['home', 'barang', 'scan', 'mine']; q('#main').dataset.dir = o.indexOf(t) >= o.indexOf(tab) ? 'r' : 'l'; tab = t; render(); };

function borrow(raw) {
  const i = item(String(raw).trim().toUpperCase().replace(/^PP:/, ''));
  if (!i) return toast('Kode barang tidak terdaftar');
  if (!i.stock) return toast(i.name + ' sedang habis');
  q('#dlgBody').innerHTML = `${photo(i.img, EMO[i.cat] || 'box', i.name)}<h2>${esc(i.name)}</h2><p class="note">${i.stock} tersedia di ${esc(i.loc)}, kondisi ${esc(i.cond.toLowerCase())}</p>
<form id="bf" data-id="${esc(i.id)}"><label>Nama peminjam<input name="who" required value="${esc(me)}"></label>
<label>Kelas<input name="kelas" required value="${esc(kelas)}" placeholder="Contoh: XI TKJ 1"></label>
<label>Jumlah<input name="qty" type="number" min="1" max="${i.stock}" value="1" required></label>
<label>Tujuan<input name="purpose" required placeholder="Contoh: praktik jaringan kelas XI"></label>
<label>Rencana kembali (maks. 14 hari)<input name="due" type="date" min="${today()}" max="${addDays(14)}" value="${addDays(3)}" required></label>
<div class="row"><button type="button" class="btn" data-close>Batal</button><button class="btn pri">Ajukan peminjaman</button></div></form>`;
  q('#dlg').showModal();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { if (d.tab === 'barang') { cat = ''; onlyFav = false; okOnly = false; term = (q('#hq') || {}).value || term; } go(d.tab); }
  else if (d.cancel) { if (confirm('Batalkan pengajuan ini?')) db.collection('loans').doc(d.cancel).update({status: 'dibatalkan'}).then(() => toast('Pengajuan dibatalkan')).catch(dbErr); }
  else if (d.open) borrow(d.open);
  else if (d.fav) { favs.has(d.fav) ? favs.delete(d.fav) : favs.add(d.fav); saveFav(); render(true); const fb = q('[data-fav="' + d.fav + '"]'); if (fb && favs.has(d.fav)) fb.classList.add('pop'); }
  else if ('ok' in d) { okOnly = !okOnly; render(true); }
  else if (d.hist !== undefined) { hist = d.hist === '1'; render(true); }
  else if ('heart' in d) { onlyFav = tab === 'barang' ? !onlyFav : true; cat = ''; term = ''; if (tab !== 'barang') go('barang'); else render(true); }
  else if (d.cat !== undefined) { cat = d.cat; onlyFav = false; term = ''; go('barang'); }
  else if (d.flt) { flt = d.flt; render(true); }
  else if (d.fill !== undefined) { e.preventDefault(); borrow(d.fill); }
  else if ('close' in d) closeDlg();
  else if (t.id === 'cam') startCam();
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { term = e.target.value; q('#list').innerHTML = gridHtml(filtered()); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));
  if (f.id === 'hs') { term = q('#hq').value; cat = ''; onlyFav = false; go('barang'); }
  else if (f.id === 'bs') {}
  else if (f.id === 'manual') borrow(v.kode);
  else if (f.id === 'bf') {
    const i = item(f.dataset.id), n = +v.qty;
    if (!i || n < 1 || n > i.stock) return toast('Jumlah melebihi stok tersedia');
    me = v.who.trim(); kelas = v.kelas.trim(); try { localStorage.setItem('pp-me', me); localStorage.setItem('pp-kelas', kelas); } catch (x) {}
    if (!auth.currentUser) return toast('Belum tersambung. Coba lagi sebentar');
    const id = 'TRX-' + Math.random().toString(36).slice(2, 7).toUpperCase();
    const sb = f.querySelector('.pri'); sb.disabled = true;
    db.collection('loans').doc(id).set({id, item: i.id, qty: n, who: me, kelas, purpose: v.purpose.trim(), date: today(), due: v.due, status: 'diajukan', uid: auth.currentUser.uid, ts: Date.now()})
      .then(() => { closeDlg(); hist = false; go('mine'); toast('Permintaan terkirim, menunggu admin'); }).catch(e => { sb.disabled = false; dbErr(e); });
  }
});

async function startCam() {
  if (!window.Html5Qrcode) return toast('Pemindai belum termuat. Ketik kode secara manual');
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: 220}, t => { stopScan(); q('#reader').innerHTML = ''; borrow(t); });
  } catch (e) { scanner = null; toast('Kamera tidak bisa dibuka. Ketik kode secara manual'); }
}

const rerender = () => { if (!ready || tab === 'scan' || (document.activeElement && document.activeElement.id === 'search')) return; render(true); };
if (!db) q('#main').innerHTML = `<p class="empty">${FB_MSG}</p>`;
else {
  render();
  watch('items', a => { D.items = byId(a); ready = true; rerender(); }, null, () => { q('#main').innerHTML = '<p class="empty">Gagal memuat data barang. Cek aturan Firestore dan koneksi internet.</p>'; });
  let unLoans = null, seen = null;
  const MSG = {disetujui: 'disetujui, silakan ambil barang', ditolak: 'ditolak', dipinjam: 'barang sudah diserahkan', selesai: 'pengembalian dicatat'};
  auth.onAuthStateChanged(u => {
    if (unLoans) unLoans(); unLoans = null; D.loans = []; seen = null;
    if (!u) return auth.signInAnonymously().catch(dbErr);
    unLoans = watch('loans', a => {
      if (seen) a.forEach(l => { if (seen[l.id] && seen[l.id] !== l.status && MSG[l.status]) toast('Pinjaman ' + l.id + ' ' + MSG[l.status]); });
      seen = {}; a.forEach(l => { seen[l.id] = l.status; });
      D.loans = byTs(a); rerender();
    }, ['uid', '==', u.uid]);
  });
}

</script>
</body>
</html>
