<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f63c9">
<link rel="icon" type="image/jpeg" href="icon.jpg">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="preload" as="image" href="splash.jpg">
<style>#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:#1f63c9 url(splash.jpg) center/cover no-repeat;transition:opacity .4s}#splash.out{opacity:0;pointer-events:none}.nosplash #splash{display:none}</style>
<script>
/* Splash: tampil langsung saat halaman dibuka, hilang setelah data siap (maks. 3 detik) */
(function(){var t0=Date.now(),done=0;
window.hideSplash=function(){if(done)return;done=1;setTimeout(function(){var e=document.getElementById('splash');if(e){e.classList.add('out');setTimeout(function(){e.remove()},400)}},Math.max(0,700-(Date.now()-t0)))};
setTimeout(window.hideSplash,3000);
function showErr(m){try{if(window.hideSplash)window.hideSplash();var e=document.getElementById('main')||document.getElementById('view');if(e&&!e.getAttribute('data-err')&&(!e.firstChild||e.querySelector('.sk'))){e.setAttribute('data-err','1');e.innerHTML='<p class="empty">Terjadi kesalahan: '+String(m).replace(/</g,'&lt;')+'<br><br><button class="btn pri" onclick="location.reload()">Muat ulang</button></p>'}}catch(x){}}
window.addEventListener('error',function(e){showErr(e.message)});
window.addEventListener('unhandledrejection',function(e){showErr(e.reason&&e.reason.message||e.reason)});
})();
</script>
<title>BisaPINJAM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* style.css: tema Modychat (header navy, lembar melengkung, pil tab, aksen coral) untuk index.html dan admin.html */
:root{--ink:#1c1f4a;--bg:#f1f2fc;--sheet:#fff;--soft:#fff;--edge:#e1e4f4;--line:#e1e4f4;--mute:#8d92b5;--dark:#f2555f;--navy:#1f2250;--tint:#fdeaec;--tinttxt:#e0414c;--ph:#e4e7f7;--ok:#1a9b6c;--red:#e0414c;--warn:#c27a0a;--page:#d9dcf0;--grad:linear-gradient(135deg,#ff6b78,#f2555f);--shadow:0 4px 16px rgba(31,34,80,.08);--c-wait:#fff1cf;--c-ok:#d8f6ec;--c-done:#e8eaf6;--c-no:#ffe0e2;box-sizing:border-box;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#eceefe;--bg:#171a3d;--sheet:#1d2149;--soft:#1f2350;--edge:rgba(160,170,255,.16);--line:rgba(160,170,255,.16);--mute:#9aa0cc;--dark:#ff6b78;--navy:#12143a;--tint:rgba(255,107,120,.16);--tinttxt:#ff8d97;--ph:rgba(255,255,255,.06);--ok:#4ade80;--red:#ff8a8a;--warn:#ffc15a;--page:#0d0f2a;--shadow:0 4px 16px rgba(0,0,0,.35);--c-wait:rgba(255,193,90,.16);--c-ok:rgba(74,222,128,.16);--c-done:rgba(255,255,255,.08);--c-no:rgba(255,138,138,.16);color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{letter-spacing:-.02em;text-wrap:balance}
p{text-wrap:pretty}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s}
button:active{transform:scale(.96)}
a{color:inherit}
:focus-visible{outline:3px solid var(--dark);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ===== komponen bersama ===== */
.note{font-size:.88rem;color:var(--mute)}
.small{font-size:.85rem;margin-top:6px}
.late{color:var(--red)}
.card{background:var(--soft);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{font-size:1rem;font-weight:700;margin:8px 0 2px}
.t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font:500 .78rem ui-monospace,Menlo,monospace;background:var(--tint);color:var(--tinttxt);padding:2px 8px;border-radius:6px}
.st{font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:999px}
.st.wait{color:var(--warn);background:var(--c-wait)}.st.ok{color:var(--ok);background:var(--c-ok)}.st.done{color:var(--mute);background:var(--c-done)}.st.no{color:var(--red);background:var(--c-no)}
.btn{border:1px solid var(--edge);border-radius:12px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-weight:700;font-size:.92rem;background:var(--soft)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent}
.btn.bad{color:var(--red)}
.btn:disabled{opacity:.7}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
label{display:block;font-size:.82rem;font-weight:600;margin-top:12px;color:var(--mute)}
label input,label select,#kode{width:100%;margin-top:4px;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--soft);color:var(--ink);font-weight:400}
.empty{padding:28px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:18px;grid-column:1/-1}
.qty{display:flex;gap:8px;margin-top:4px}
.qty input{margin:0;text-align:center;flex:1;font-weight:700;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qty button{width:50px;border:1px solid var(--edge);border-radius:12px;background:var(--soft);font-size:1.4rem;font-weight:700;color:var(--dark)}
.qrbox{display:grid;place-items:center;background:#fff;border-radius:18px;padding:14px;width:fit-content;min-width:200px;min-height:200px;margin:14px auto;color:#1c1f4a;text-align:center}

/* dialog (bottom sheet) */
dialog{border:0;border-radius:28px 28px 0 0;padding:0;width:min(460px,100%);max-width:100%;margin:auto auto 0;background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,30,.55)}
.sheet{max-height:88vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
.sheet h2{font-size:1.35rem;font-weight:700}
.sheet .ph{height:200px;border-radius:18px;margin-bottom:14px}
.sheet .t{align-items:flex-start;gap:10px}.sheet .t .st{flex:none;margin-top:4px}
#bferr:empty{display:none}#bferr{background:var(--c-no);padding:8px 12px;border-radius:10px;font-weight:600}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.9rem;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
dialog[open]{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fade .3s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== kerangka Modychat: header navy + pil tab + lembar melengkung ===== */
.hd{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;object-fit:cover;flex:none;background:var(--tint)}
.logo-fb{display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:800;font-size:1.3rem}
.word,.hd h1{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1;color:#fff}
.hi{display:block;font-size:.74rem;color:rgba(255,255,255,.7);font-weight:600;margin-top:2px}
.hd a{color:#fff;opacity:.85;font-weight:600;font-size:.88rem}
.ibtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.ibtn+.ibtn{margin-left:6px}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#f2555f;color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.28);border-radius:16px;padding:6px}
.seg:empty{display:none}
.seg button{flex:1;min-width:0;height:42px;border:0;border-radius:12px;background:none;color:#9fa4d4;font-weight:600;font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px}
.seg button svg{width:18px;height:18px}
.seg button[aria-current="true"],.seg button[aria-pressed="true"]{background:rgba(0,0,0,.42);color:#fff}
.sheetc{position:relative;background:var(--bg);margin-top:-48px;border-radius:48px 0 0 0;padding:30px 18px 120px;min-height:62vh}
/* lengkung kanan: sudut kanan-bawah header navy membulat, lembar terang naik di baliknya */
.sheetc::after{content:"";position:absolute;right:0;top:-48px;width:48px;height:48px;pointer-events:none;background:radial-gradient(circle at 0 0,transparent 47.5px,var(--bg) 48px)}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#1c1f4a;border-radius:14px;padding:0 6px 0 14px;height:48px;margin-top:14px}
.search>svg{color:var(--dark)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:#1c1f4a}
.search:focus-within{outline:3px solid var(--dark)}
.flt{width:36px;height:36px;border:0;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center}
.bar2{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:14px}
.bar2 h2{text-align:center;font-size:1.15rem;font-weight:700;color:#fff}

/* ===== halaman peminjam ===== */
.app{max-width:460px;min-height:100vh;margin:0 auto}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border:0;background:none;font-size:.72rem;font-weight:700;color:var(--ink)}
.quick i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.quick svg{width:22px;height:22px}
.q1{background:#f2555f}.q2{background:#6a3df0}.q3{background:#3f7bf0}.q4{background:#f5a524}
.hero{position:relative;display:grid;grid-template-columns:1.25fr 1fr;background:var(--navy);color:#fff;border-radius:28px;overflow:hidden;min-height:190px}
.hero::before{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(242,85,95,.28)}
.hero::after{content:"";position:absolute;left:-30px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero>div:first-child{padding:20px 0 20px 18px;display:flex;flex-direction:column;align-items:flex-start}
.pill{background:rgba(255,255,255,.14);color:#fff;border-radius:8px;font-size:.75rem;padding:3px 10px;font-weight:600}
.hero h2{font-size:1.3rem;line-height:1.2;font-weight:700;margin:12px 0 8px}
.hero p{font-size:.85rem;opacity:.78;margin-bottom:14px}
.dark{background:var(--grad);color:#fff;border:0;border-radius:10px;min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;font-weight:700;font-size:.9rem;margin-top:auto}
.ph{position:relative;overflow:hidden;background:var(--ph);display:grid;place-items:center}
.ph .ico{opacity:.5;color:var(--tinttxt)}
.ph .ico svg{width:30px;height:30px;stroke-width:1.4}
.ph img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.hero .ph{background:transparent;margin:10px 10px 0 0;border-radius:90px 90px 0 0}
.hero .ph .ico{color:#fff}.hero .ph .ico svg{width:44px;height:44px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.stat3 div{background:var(--soft);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;box-shadow:var(--shadow)}
.stat3 svg{width:22px;height:22px;color:var(--dark);grid-row:1/3}
.stat3 b{font-size:1.15rem;line-height:1.1}.stat3 span{font-size:.7rem;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.sec h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}.sec h3 svg{width:18px;height:18px;color:var(--dark)}
.sec button{border:0;background:none;color:var(--dark);font-weight:600;font-size:.82rem;padding:0}
.sec button::after{content:" ›"}
.cats,.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.cats{justify-content:space-between;padding-bottom:4px}
.cat{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:.76rem;font-weight:600;text-align:center;min-width:62px}
.cat span{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:var(--tinttxt);background:var(--tint)}
.cat span svg{width:26px;height:26px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--navy);border-radius:16px;padding:6px;margin:12px 0}
.toggle button{height:40px;border:0;border-radius:12px;background:none;color:#aeb3dd;font-weight:600;font-size:.88rem}
.toggle button[aria-pressed="true"]{background:rgba(0,0,0,.42);color:#fff}
.chips{margin:0 0 14px}
.chips button{flex:none;border:0;border-radius:12px;background:var(--soft);padding:10px 18px;font-weight:600;font-size:.86rem;box-shadow:var(--shadow)}
.chips button[aria-pressed="true"]{background:var(--navy);color:#fff}
/* daftar barang = baris ala daftar chat */
.grid2{display:grid;grid-template-columns:1fr;gap:0}
.pc{position:relative;border-bottom:1px solid var(--edge);padding:12px 0}
.pcb{display:grid;grid-template-columns:56px 1fr;column-gap:14px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:0}
.pcb .ph{width:56px;height:56px;grid-row:1/3;border-radius:16px}
.pcb h4{font-size:.95rem;font-weight:700;margin:0 40px 2px 0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin:0}
.av{font-size:.78rem;font-weight:600;margin:0;color:var(--mute)}
.av.none{color:var(--red)}
.pact{position:absolute;right:0;bottom:12px;display:flex;gap:6px}
.pact button{height:32px;border-radius:999px;border:1px solid var(--edge);background:var(--soft);color:var(--tinttxt);font-weight:700;font-size:.76rem;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 12px}
.pact svg{width:15px;height:15px}
.pact .addb{background:var(--grad);color:#fff;border-color:transparent}
.pact .addb:disabled{background:var(--c-done);color:var(--mute)}
.fav{position:absolute;top:10px;right:0;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--mute);display:grid;place-items:center;z-index:1}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:#f2555f}.fav[aria-pressed="true"] svg{fill:currentColor}
#reader{max-width:340px;margin:12px 0;border-radius:18px;overflow:hidden}
.foot{text-align:center;margin-top:28px;font-size:.82rem;color:var(--mute)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes pulse{50%{opacity:.45}}
#main.in{animation:inR .24s cubic-bezier(.2,.8,.2,1) backwards}
#main.in[data-dir="l"]{animation-name:inL}
.fav.pop svg{animation:pop .4s}
.sk{background:var(--ph);border-radius:18px;animation:pulse 1.2s ease-in-out infinite}
#main>.sk,#main>.grid2{margin-left:18px;margin-right:18px}

/* ===== halaman admin ===== */
.wrap{max-width:900px;margin:0 auto}
.tabs-note{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.grid .card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:var(--soft);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stats b{display:block;font-size:1.5rem;color:var(--dark)}
.stats>div:nth-child(2) b{color:#6a3df0}.stats>div:nth-child(4) b{color:var(--ok)}
.row.flush{margin:0 0 14px}
.row .btn{min-height:44px}
.aq{flex:2;min-width:0;padding:11px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--soft);color:var(--ink)}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lbl{background:#fff;color:#1c1f4a;border:1px dashed #9cb4d8;border-radius:12px;padding:16px;text-align:center;break-inside:avoid}
.lbl .q{display:grid;place-items:center;margin-bottom:10px;padding:8px;background:#fff}.lbl .q img,.lbl .q canvas{max-width:100%;height:auto}
.lbl b{display:block;font-size:1rem;line-height:1.3}
.lbl span{font:600 .9rem ui-monospace,monospace}
.gate{max-width:340px;margin:12vh auto 0}
.fup{display:grid;gap:8px;margin:10px 0}
.fprev{height:170px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--mute);font-size:.85rem;background:var(--ph)}
.fprev img{width:100%;height:100%;object-fit:cover}
.fup .row{margin:0}
.cf{margin:12px 0;display:grid;gap:8px}
.cf .chips{flex-wrap:wrap;overflow:visible;margin:0}
.cf .chips button{padding:8px 14px;min-height:38px;font-size:.85rem;box-shadow:none;border:1px solid var(--edge)}
.cnew{display:none;width:100%;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--soft);color:var(--ink);font-size:1rem}
.cnew.on{display:block}
.fab{position:fixed;right:max(16px,calc(50% - 434px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:16px;background:var(--grad);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(242,85,95,.4);z-index:19}
.fab svg{width:26px;height:26px}.fab[hidden]{display:none}
#toast{z-index:100}
@media print{body{background:#fff}.hd,.fab{display:none!important}.sheetc{margin:0;border-radius:0;padding:0;background:#fff}#view>*:not(.qrs){display:none!important}.qrs{grid-template-columns:repeat(2,1fr)}.lbl{border:1px solid #000}}


/* ===== penyempurnaan: judul tengah, lembar bergradien, avatar pastel, lencana stok, FAB ===== */
:root{--bg:#f5f6fe;--bg2:#e9ebf9}
@media(prefers-color-scheme:dark){:root{--bg:#171a3d;--bg2:#0f1233}}
.top{display:grid;grid-template-columns:94px 1fr 94px;align-items:center;gap:6px}
.top .logo{justify-self:start}
.top>div:last-child,.top>a{justify-self:end;white-space:nowrap}
.ttl{text-align:center;min-width:0}
.hd h1{font-size:1rem;text-align:center}
.sheetc{background:linear-gradient(180deg,var(--bg),var(--bg2))}
.pcb{position:relative}
.nb{position:absolute;left:42px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:#f2555f;color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);z-index:1}
.pc:nth-child(4n+1) .pcb .ph{background:#fde4d3}
.pc:nth-child(4n+2) .pcb .ph{background:#e1ddfb}
.pc:nth-child(4n+3) .pcb .ph{background:#d5f1ea}
.pc:nth-child(4n+4) .pcb .ph{background:#d8e8fb}
@media(prefers-color-scheme:dark){.pc .pcb .ph{background:rgba(255,255,255,.08)!important}}
.more{display:block;margin:10px 0 0;border:0;background:none;color:var(--dark);font-weight:600;font-size:.82rem;padding:6px 0}
.seg button{transition:background .2s,color .2s}
.seg button:focus-visible{outline-color:#fff}

/* ===== Palet final: biru, kuning, putih ===== */

<script>
/* common.js: Firebase (Firestore + Auth) dan helper yang dipakai index.html dan admin.html. */
const firebaseConfig = {
  apiKey: 'AIzaSyDY3JSSFZVHrHqAhiEbl8jAhvFwv0cOdwY',
  authDomain: 'pinjam-6eb03.firebaseapp.com',
  projectId: 'pinjam-6eb03',
  appId: '1:156543745657:web:7aa2b752c60bb678741ea8'
};
const FB_READY = typeof firebase !== 'undefined';
const FB_MSG = 'Firebase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';
let db = null, auth = null;
if (FB_READY) { firebase.initializeApp(firebaseConfig); db = (function(){var d=firebase.firestore();try{d.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}return d})(); auth = firebase.auth(); }
let D = {items: [], loans: []};
const errMsg = e => { const c = (e && e.code) || ''; return c === 'permission-denied' ? 'Akses ditolak. Cek Rules Firestore sudah di-Publish' : /operation-not-allowed|admin-restricted/.test(c) ? 'Login Anonymous belum diaktifkan di Firebase Authentication' : c === 'auth/unauthorized-domain' ? 'Domain web ini belum diizinkan di Firebase (Authorized domains)' : (c === 'timeout' || c === 'unavailable') ? 'Tidak bisa terhubung ke server. Cek internet, matikan VPN atau ad-blocker' : 'Gagal: ' + ((e && e.message) || 'coba lagi'); };
const dbErr = e => toast(errMsg(e));
const watch = (name, cb, where, fail) => { let r = db.collection(name); if (where) r = r.where(...where); return r.onSnapshot(s => cb(s.docs.map(d => d.data())), e => { dbErr(e); if (fail) fail(e); }); };
const byTs = a => a.sort((x, y) => (x.ts || 0) - (y.ts || 0));
const byId = a => a.sort((x, y) => x.id.localeCompare(y.id));

const q = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); /* tanggal lokal, bukan UTC */
const today = () => ymd(new Date());
const addDays = n => ymd(new Date(Date.now() + n * 864e5));
const fmt = d => d ? new Date(d + 'T00:00').toLocaleDateString('id-ID', {day:'numeric', month:'short'}) : '-';
const item = id => D.items.find(i => i.id === id);
const toast = m => { const t = q('#toast'), d = q('#dlg'); (d.open ? d : document.body).appendChild(t); /* agar tampil di atas dialog */ t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), Math.max(2400, m.length * 70)); };
const closeDlg = () => q('#dlg').close();
q('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDlg(); });
const qrUrl = id => location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html?i=' + encodeURIComponent(id); /* isi QR = tautan, bisa discan kamera HP biasa */

const STAT = {diajukan:['Menunggu persetujuan','wait'], disetujui:['Disetujui, siap diambil','ok'], dipinjam:['Sedang dipinjam','ok'], selesai:['Selesai','done'], ditolak:['Ditolak','no'], dibatalkan:['Dibatalkan','no']};
const loanInfo = l => {
  const i = item(l.item) || {name: l.item}, [s, c] = STAT[l.status], late = l.status === 'dipinjam' && l.due < today();
  return `<div class="t"><span class="code">${esc(l.id)}</span><span class="st ${c}">${s}</span></div>
<h3>${esc(i.name)} × ${l.qty}</h3><p class="note">${esc(l.who)}${l.kelas ? ' (' + esc(l.kelas) + ')' : ''}, untuk ${esc(l.purpose)}</p>
<p class="small">Pinjam ${fmt(l.date)}, kembali ${fmt(l.due)}${l.ret ? `, dikembalikan ${fmt(l.ret.date)} (${esc(l.ret.cond.toLowerCase())})` : ''}${late ? ' <b class="late">Terlambat</b>' : ''}</p>${l.note ? `<p class="small note">Catatan admin: ${esc(l.note)}</p>` : ''}`;
};

<script>
/* Logika admin: login Firebase Auth (email/kata sandi), data real-time dari Firestore.
   Akun admin = akun Auth yang UID-nya ada di koleksi "admins" (lihat aturan Firestore). */
/* Akun Firebase untuk admin. Kata sandi akun ini = PIN. Buat di Authentication > Users. */
const ADMIN_EMAIL = 'admin@bisapinjam.com';
let tab = 'req', filt = 'diajukan', admin = false, ready = false, unsub = [];
const FILT = [['diajukan', 'Menunggu'], ['disetujui', 'Siap diambil'], ['dipinjam', 'Dipinjam'], ['telat', 'Terlambat'], ['selesai', 'Selesai'], ['ditolak', 'Ditolak'], ['dibatalkan', 'Dibatalkan']];

let aterm = '';
const hit = (l, s) => s === 'telat' ? l.status === 'dipinjam' && l.due < today() : l.status === s;
const listHtml = () => {
  const t = aterm.toLowerCase();
  const list = D.loans.filter(l => hit(l, filt) && (!t || [l.id, l.who, l.kelas || '', l.purpose, (item(l.item) || {}).name].join(' ').toLowerCase().includes(t))).reverse();
  return list.length ? list.map(loanCard).join('') : '<p class="empty">Tidak ada data di status ini.</p>';
};
const csv = () => {
  const c = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['Kode', 'Barang', 'Jumlah', 'Peminjam', 'Kelas', 'Tujuan', 'Tgl pinjam', 'Rencana kembali', 'Status', 'Tgl kembali', 'Kondisi kembali', 'Catatan']]
    .concat(D.loans.map(l => [l.id, (item(l.item) || {}).name || l.item, l.qty, l.who, l.kelas || '', l.purpose, l.date, l.due, STAT[l.status][0], l.ret ? l.ret.date : '', l.ret ? l.ret.cond : '', l.note || '']));
  const el = document.createElement('a');
  el.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(c).join(',')).join('\n')], {type: 'text/csv;charset=utf-8'}));
  el.download = 'pinjaman-' + today() + '.csv'; el.click(); setTimeout(() => URL.revokeObjectURL(el.href), 1000);
};
const loanCard = l => {
  const acts = {
    diajukan: '<button class="btn bad" data-act="tolak">Tolak</button><button class="btn pri" data-act="setuju">Setujui</button>',
    disetujui: '<button class="btn bad" data-act="tolak">Batalkan</button><button class="btn pri" data-act="serah">Serahkan barang</button>',
    dipinjam: '<button class="btn" data-act="extend">Perpanjang 3 hari</button><button class="btn pri" data-act="kembali">Terima pengembalian</button>'
  }[l.status] || '';
  return `<article class="card" data-loan="${esc(l.id)}">${loanInfo(l)}${['diajukan', 'disetujui'].includes(l.status) ? (st => `<p class="small ${st < l.qty ? 'late' : 'note'}">Stok sekarang: ${st}${st < l.qty ? ', kurang dari jumlah diminta' : ''}</p>`)((item(l.item) || {}).stock || 0) : ''}${acts ? `<div class="row">${acts}</div>` : ''}</article>`;
};

const views = {
  req: () => {
    const n = s => D.loans.filter(l => hit(l, s)).length;
    return `<div class="stats"><div><b>${n('diajukan')}</b><span class="note">Menunggu</span></div><div><b>${n('dipinjam')}</b><span class="note">Dipinjam</span></div><div><b>${n('telat')}</b><span class="note">Terlambat</span></div><div><b>${D.items.reduce((a, i) => a + i.stock, 0)}</b><span class="note">Stok tersedia</span></div></div>
<div class="row flush"><input id="aq" class="aq" type="search" placeholder="Cari nama, barang, atau kode" aria-label="Cari pinjaman" value="${esc(aterm)}"><button class="btn" data-act="csv">Ekspor CSV</button></div>
<div class="chips">${FILT.map(([k, l]) => `<button data-filt="${k}" aria-pressed="${filt === k}">${l} (${n(k)})</button>`).join('')}</div>
<div class="grid" id="alist">${listHtml()}</div>`;
  },
  stok: () => `<div class="row flush"><button class="btn pri" data-act="baru">+ Tambah barang</button></div>
<div class="grid">${D.items.length ? D.items.map(i => `<article class="card"><div class="t"><span class="code">${esc(i.id)}</span><span class="note">${esc(i.cat)}</span></div>
<h3>${esc(i.name)}</h3><p class="note">${esc(i.loc)}, kondisi ${i.cond === 'Baik' ? 'baik' : '<b class="late">' + esc(i.cond.toLowerCase()) + '</b>'}</p><p class="small"><b>${i.stock}</b> tersedia dari ${i.total}${i.stock === 0 ? ' <b class="late">Habis</b>' : ''}</p>
<div class="row"><button class="btn" data-qrshow="${esc(i.id)}">QR</button><button class="btn" data-edit="${esc(i.id)}">Ubah</button><button class="btn bad" data-del="${esc(i.id)}">Hapus</button></div></article>`).join('') : '<p class="empty">Belum ada barang. Tekan "+ Tambah barang" untuk mulai.</p>'}</div>`,
  qr: () => `<div class="row flush"><button class="btn pri" onclick="print()">Cetak semua label</button></div>
<div class="qrs">${D.items.map(i => `<div class="lbl"><div class="q" data-qr="${esc(qrUrl(i.id))}"></div><b>${esc(i.name)}</b><span>${esc(i.id)}</span></div>`).join('') || '<p class="empty">Belum ada barang.</p>'}</div>`
};

function render() {
  const tabs = q('#tabs'), view = q('#view');
  q('#fab').hidden = !(db && ready && admin && tab === 'stok');
  tabs.innerHTML = '';
  if (!db) { view.innerHTML = `<p class="empty">${FB_MSG}</p>`; return; }
  if (!ready) { view.innerHTML = '<p class="empty">Memuat…</p>'; return; }
  if (!admin) {
    view.innerHTML = `<form class="card gate" id="gate"><h3>Masuk admin</h3><label>PIN<input type="password" name="pin" inputmode="numeric" pattern="[0-9]*" minlength="6" maxlength="6" required autocomplete="off" placeholder="Masukkan 6 digit PIN" style="text-align:center;letter-spacing:.4em"></label><div class="row"><button class="btn pri">Masuk</button></div></form>`;
    return;
  }
  const TI = {'req': '<path d="M9 3h6a2 2 0 0 1 2 2H7a2 2 0 0 1 2-2zM7 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1M9 12h6M9 16h4"/>', 'stok': '<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>', 'qr': '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM20 14v6h-6"/>', 'out': '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'}; const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + TI[k] + '</svg>';
  tabs.innerHTML = [['req', 'Permintaan'], ['stok', 'Barang'], ['qr', 'Label QR']].map(([k, l]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${svg(k)}<span>${l}</span></button>`).join('') + '<button data-out>' + svg('out') + '<span>Keluar</span></button>';
  view.innerHTML = views[tab]();
  document.querySelectorAll('[data-qr]').forEach(el => new QRCode(el, {text: el.dataset.qr, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M}));
}

function showQr(id) {
  const i = item(id); if (!i) return;
  q('#dlgBody').innerHTML = `<h2>${esc(i.name)}</h2><p class="note">${esc(i.id)}. Scan dengan kamera HP biasa atau menu Scan di halaman peminjam.</p><div class="qrbox" id="qrBox"></div><p class="small note" style="word-break:break-all">${esc(qrUrl(id))}</p><div class="row"><button class="btn" data-close>Tutup</button><button class="btn pri" data-copy="${esc(qrUrl(id))}">Salin tautan</button></div>`;
  q('#dlg').showModal(); new QRCode(q('#qrBox'), {text: qrUrl(id), width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M});
}
const KAT = ['Komputer', 'Alat jaringan', 'Perangkat jaringan', 'Presentasi', 'Elektronik', 'Alat tulis'];
const LOK = ['Lab Komputer', 'Lab Jaringan', 'Gudang', 'Perpustakaan', 'Ruang Guru', 'Bengkel'];
const uniq = l => l.filter((c, k) => c && l.indexOf(c) === k);
const chipField = (name, label, opts, val, custom) => {
  const all = opts.concat(val && opts.indexOf(val) < 0 ? [val] : []);
  return `<div class="cf"><div class="small note">${label}</div><div class="chips">${all.map(o => `<button type="button" data-chipf="${name}" data-v="${esc(o)}" aria-pressed="${o === val}">${esc(o)}</button>`).join('')}${custom ? `<button type="button" data-chipf="${name}" data-v="__new" aria-pressed="false">+ Lainnya</button>` : ''}</div><input type="hidden" name="${name}" value="${esc(val || '')}">${custom ? `<input class="cnew" placeholder="Ketik ${label.toLowerCase()} baru">` : ''}</div>`;
};
function itemForm(i) {
  q('#dlgBody').innerHTML = `<h2>${i ? 'Ubah barang' : 'Barang baru'}</h2><form id="itf" data-id="${i ? esc(i.id) : ''}">
<label>Nama barang<input name="name" required value="${esc(i ? i.name : '')}" placeholder="Contoh: Laptop Asus"></label>
${chipField('cat', 'Kategori', uniq(KAT.concat(D.items.map(x => x.cat))), i ? i.cat : '', true)}
${chipField('loc', 'Lokasi', uniq(LOK.concat(D.items.map(x => x.loc))), i ? i.loc : '', true)}
<div class="cf"><div class="small note">Jumlah total</div><div class="qty"><button type="button" data-qty="-1" aria-label="Kurangi">−</button><input name="total" type="number" min="1" required value="${i ? i.total : 1}" inputmode="numeric"><button type="button" data-qty="1" aria-label="Tambah">+</button></div><div class="chips">${[1, 5, 10, 20].map(n => `<button type="button" data-setqty="${n}">${n}</button>`).join('')}</div></div>
${chipField('cond', 'Kondisi', ['Baik', 'Rusak ringan', 'Rusak'], i ? i.cond : 'Baik', false)}
<div class="fup"><div class="small note">Foto barang (opsional)</div><div class="fprev" id="fprev"></div><div class="row"><button type="button" class="btn pri" data-pick>Pilih foto dari galeri</button><button type="button" class="btn bad" data-delimg>Hapus foto</button></div><input type="file" id="ffile" accept="image/*" hidden><input type="hidden" name="img" id="imgv"></div>
<div class="row"><button type="button" class="btn" data-close>Batal</button><button class="btn pri">Simpan</button></div></form>`;
  q('#dlg').showModal(); q('#imgv').value = (i && i.img) || ''; setPrev(i && i.img);
}
const setPrev = src => { q('#fprev').innerHTML = src ? `<img src="${esc(src)}" alt="" onerror="this.parentNode.textContent='Foto tidak ditemukan'">` : 'Belum ada foto'; };
/* foto dari galeri: diperkecil (maks. 640 px) lalu disimpan langsung di data barang, tanpa Firebase Storage */
function compress(file, max = 640) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      let out = c.toDataURL('image/jpeg', .72); if (out.length > 160000) out = c.toDataURL('image/jpeg', .5);
      URL.revokeObjectURL(url); ok(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('Foto tidak bisa dibaca')); };
    im.src = url;
  });
}
document.addEventListener('input', e => { if (e.target.classList.contains('cnew')) e.target.closest('.cf').querySelector('input[type="hidden"]').value = e.target.value.trim(); });
document.addEventListener('change', async e => {
  if (e.target.id !== 'ffile' || !e.target.files[0]) return;
  try { const out = await compress(e.target.files[0]); q('#imgv').value = out; setPrev(out); toast('Foto siap, jangan lupa tekan Simpan'); }
  catch (x) { toast(x.message || 'Foto gagal diproses'); }
  e.target.value = '';
});

const setLoan = (id, patch, msg) => db.collection('loans').doc(id).update(patch).then(() => toast(msg)).catch(dbErr);
const handover = id => db.runTransaction(async t => {
  const lr = db.collection('loans').doc(id), ls = await t.get(lr), L = ls.data();
  const ir = db.collection('items').doc(L.item), isn = await t.get(ir), I = isn.data();
  if (L.status !== 'disetujui') throw new Error('Status pinjaman sudah berubah');
  if (!I || I.stock < L.qty) throw new Error('Stok tidak cukup untuk diserahkan');
  t.update(ir, {stock: I.stock - L.qty}); t.update(lr, {status: 'dipinjam', date: today()});
}).then(() => toast('Barang diserahkan')).catch(dbErr);
const giveBack = (id, cond) => db.runTransaction(async t => {
  const lr = db.collection('loans').doc(id), ls = await t.get(lr), L = ls.data();
  const ir = db.collection('items').doc(L.item), isn = await t.get(ir);
  if (L.status !== 'dipinjam') throw new Error('Status pinjaman sudah berubah');
  t.update(lr, {status: 'selesai', ret: {date: today(), cond}});
  if (isn.exists) { const I = isn.data(), up = {stock: Math.min(I.total, I.stock + L.qty)}; if (cond !== 'Baik') up.cond = cond; t.update(ir, up); }
}).then(() => { closeDlg(); toast('Pengembalian dicatat'); }).catch(dbErr);

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { tab = d.tab; render(); }
  else if ('out' in d) auth.signOut();
  else if ('pick' in d) q('#ffile').click();
  else if (d.chipf) { const box = t.closest('.cf'), hid = box.querySelector('input[type="hidden"]'), nw = box.querySelector('.cnew'); box.querySelectorAll('[data-chipf]').forEach(b => b.setAttribute('aria-pressed', b === t)); if (d.v === '__new') { nw.classList.add('on'); nw.focus(); hid.value = nw.value.trim(); } else { if (nw) nw.classList.remove('on'); hid.value = d.v; } }
  else if (d.qty) { const n = t.parentElement.querySelector('input'); n.value = Math.max(1, (+n.value || 1) + +d.qty); }
  else if (d.setqty) q('#itf [name="total"]').value = d.setqty;
  else if ('delimg' in d) { q('#imgv').value = ''; setPrev(''); }
  else if (d.filt) { filt = d.filt; render(); }
  else if ('close' in d) closeDlg();
  else if (d.qrshow) showQr(d.qrshow);
  else if (d.copy) navigator.clipboard.writeText(d.copy).then(() => toast('Tautan disalin')).catch(() => toast('Gagal menyalin'));
  else if (d.edit) itemForm(item(d.edit));
  else if (d.del) {
    if (D.loans.some(l => l.item === d.del && ['diajukan', 'disetujui', 'dipinjam'].includes(l.status))) return toast('Masih ada pinjaman aktif untuk barang ini');
    if (confirm('Hapus barang ' + d.del + '?')) db.collection('items').doc(d.del).delete().catch(dbErr);
  }
  else if (d.act === 'baru') itemForm();
  else if (d.act === 'csv') csv();
  else if (d.act) {
    const id = t.closest('[data-loan]').dataset.loan;
    if (d.act === 'setuju') setLoan(id, {status: 'disetujui'}, 'Pinjaman disetujui');
    else if (d.act === 'tolak') {
      q('#dlgBody').innerHTML = `<h2>Tolak pinjaman</h2><form id="nf" data-id="${esc(id)}"><label>Alasan (opsional, tampil ke peminjam)<input name="note" maxlength="140"></label>
<div class="row"><button type="button" class="btn" data-close>Batal</button><button class="btn pri">Tolak</button></div></form>`;
      q('#dlg').showModal();
    }
    else if (d.act === 'serah') handover(id);
    else if (d.act === 'extend') { const l = D.loans.find(x => x.id === id), t2 = new Date(l.due + 'T00:00:00Z'); t2.setUTCDate(t2.getUTCDate() + 3); setLoan(id, {due: t2.toISOString().slice(0, 10)}, 'Diperpanjang 3 hari'); }
    else if (d.act === 'kembali') {
      q('#dlgBody').innerHTML = `<h2>Terima pengembalian</h2><form id="rf" data-id="${esc(id)}"><label>Kondisi barang<select name="cond"><option>Baik</option><option>Rusak ringan</option><option>Rusak</option></select></label>
<div class="row"><button type="button" class="btn" data-close>Batal</button><button class="btn pri">Selesai</button></div></form>`;
      q('#dlg').showModal();
    }
  }
});

document.addEventListener('input', e => { if (e.target.id === 'aq') { aterm = e.target.value; q('#alist').innerHTML = listHtml(); } });

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));
  if (f.id === 'gate') auth.signInWithEmailAndPassword(ADMIN_EMAIL, v.pin.trim()).catch(e => toast(e && e.code === 'auth/too-many-requests' ? 'Terlalu banyak percobaan, coba lagi nanti' : 'PIN salah'));
  else if (f.id === 'rf') giveBack(f.dataset.id, v.cond);
  else if (f.id === 'nf') { closeDlg(); setLoan(f.dataset.id, {status: 'ditolak', note: v.note.trim()}, 'Pinjaman ditolak'); }
  else if (f.id === 'itf') {
    if (!v.cat) return toast('Pilih kategori dulu'); if (!v.loc) return toast('Pilih lokasi dulu');
    const total = +v.total, base = {name: v.name.trim(), cat: v.cat.trim(), loc: v.loc.trim(), cond: v.cond, img: v.img.trim(), total};
    let p;
    if (f.dataset.id) {
      const i = item(f.dataset.id), out = i.total - i.stock;
      if (total < out) return toast('Total tidak boleh kurang dari barang yang sedang dipinjam (' + out + ')');
      p = db.collection('items').doc(i.id).update({...base, stock: total - out});
    } else {
      const n = Math.max(0, ...D.items.map(i => +i.id.replace(/\D/g, '') || 0)) + 1, id = 'BRG-' + String(n).padStart(3, '0');
      p = db.collection('items').doc(id).set({id, ...base, stock: total});
    }
    p.then(() => { closeDlg(); toast('Barang disimpan'); }).catch(dbErr);
  }
});

let asig = '';
const snap = () => { const s = JSON.stringify([D.items, D.loans]); if (s === asig) return; asig = s; render(); };
if (db) auth.onAuthStateChanged(async u => {
  asig = ''; unsub.forEach(f => f()); unsub = []; admin = false; D = {items: [], loans: []};
  if (u && !u.isAnonymous) {
    try { admin = (await db.collection('admins').doc(u.uid).get()).exists; } catch (e) {}
    if (!admin) { toast('Akun ini bukan admin'); return auth.signOut(); }
    unsub = [watch('items', a => { D.items = byId(a); snap(); }), watch('loans', a => { D.loans = byTs(a); snap(); })];
  }
  ready = true; render(); hideSplash();
});
render();
</script>
</body>
</html>
